<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ثبت‌نام کاربر</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(to right, #70b2d8, #f7fcff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #ffffff;
      padding: 50px 35px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 123, 255, 0.15);
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
      animation: fadeInUp 1s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      text-align: center;
      color: #007BFF;
      margin-bottom: 35px;
      font-size: 22px;
      position: relative;
      padding-right: 35px;
    }

    h2::before {
      content: "📝";
      position: absolute;
      right: 0;
      top: 0;
      font-size: 28px;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 12px;
      border: 1.5px solid #ccddee;
      font-size: 15px;
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #007BFF;
      box-shadow: 0 0 8px rgba(0, 123, 255, 0.25);
    }

    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #0f7bff, #5ce1e6);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s;
      margin-top: 20px;
    }

    button:hover {
      background: linear-gradient(135deg, #0d6efd, #39c0c8);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 123, 255, 0.3);
    }

    .message {
      margin-top: 25px;
      color: #28a745;
      text-align: center;
      font-weight: bold;
      display: none;
      font-size: 15px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
        border-radius: 16px;
      }

      h2 {
        font-size: 20px;
        padding-right: 30px;
      }

      h2::before {
        font-size: 24px;
      }

      input, button {
        font-size: 14px;
        padding: 12px;
      }

      .message {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>فرم ثبت‌نام</h2>
    <form id="registerForm">
      <input type="text" id="username" placeholder="نام کاربری" required>
      <input type="email" id="email" placeholder="ایمیل" required>
      <input type="password" id="password" placeholder="رمز عبور" required>
      <button type="submit">ثبت‌نام</button>
    </form>
    <div class="message" id="successMessage">ثبت‌نام با موفقیت انجام شد! در حال انتقال...</div>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (username && email && password) {
        localStorage.setItem("username", username);
        localStorage.setItem("email", email);

        document.getElementById("successMessage").style.display = "block";

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 2000);
      } else {
        alert("لطفاً تمام فیلدها را پر کنید.");
      }
    });
  </script>

</body>
</html>
