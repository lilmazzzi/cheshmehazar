<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تماس با ما - چشمه آذر</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Vazir', sans-serif;
      background-color: #ffffff;
      color: #333;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(to left, #1d19ff, #458cd8);
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      background-color: #007BFF;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    nav a:hover {
      background-color: #005fcc;
    }

    .contact-info {
      text-align: center;
      margin: 40px 20px;
      animation: fadeIn 1.5s ease-in;
    }

    .contact-info h2 {
      color: #007BFF;
      font-size: 32px;
      margin-bottom: 20px;
    }

    .contact-info p {
      font-size: 18px;
      margin: 10px 0;
    }

    .contact-info i {
      color: #007BFF;
      margin-left: 8px;
    }

    .whatsapp-button a {
      display: inline-block;
      padding: 12px 24px;
      background-color: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: background-color 0.3s, transform 0.3s;
      font-size: 16px;
    }

    .whatsapp-button a:hover {
      background-color: #128C7E;
      transform: scale(1.05);
    }

    footer {
      background-color: #4580b7;
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: white;
    }

    main {
      flex: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="index.html"><i class="fas fa-home"></i> بازگشت به خانه</a>
    </nav>
  </header>

  <main>
    <section class="contact-info">
      <h2><i class="fas fa-phone-volume"></i> تماس با ما</h2>
      <p><i class="fas fa-phone-alt"></i> <strong>شماره تماس:</strong>  09193370610</p>
      <p><i class="fas fa-map-marker-alt"></i> <strong>آدرس:</strong> خیابان سهروردی شمالی، نرسیده به عباس‌آباد</p>

      <div class="whatsapp-button" style="margin-top: 20px;">
        <a href="https://wa.me/989193370610" target="_blank">
          <i class="fab fa-whatsapp"></i> ارتباط در واتساپ
        </a>
      </div>
    </section>
  </main>

  <footer>
    © 2025 چشمه آذر - تمامی حقوق محفوظ است.
  </footer>
</body>
</html>
